<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hozir.uz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    header {
      background-color:#1d1d1d;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
   
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00aced;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: rgb(255, 255, 255);
      font-size: 16px;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: rgb(255, 255, 255);
    }

    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box input {
      padding: 6px 12px;
      border: 1px solid #777;
      border-radius: 20px;
      font-size: 14px;
    }

    .lang-select {
      padding: 5px;
      font-size: 14px;
    }

    .date {
      font-size: 14px;
      color: #c1c1c1;
    }

    /* Responsive menyu uchun  */
    .menu-toggle {
      display: none;
    }

    .menu-icon {
      display: none;
      font-size: 28px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
      }

      .menu-toggle:checked+label+nav {
        display: flex;
      }

      .menu-icon {
        display: block;
        color: rgb(255, 255, 255);
        ;

      }

      .header-right {
        width: 100%;
        justify-content: space-between;
        margin-top: 10px;
      }
    }
    .site-footer {
  background-color: #1d1d1d;
  color: #fff;
  padding: 40px 20px 20px;
  font-family: Arial, sans-serif;
}
.footer-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
}

.footer-logo h2 {
  margin: 0;
  color: #00aced;
}
footer-logo p {
  margin-top: 10px;
  font-size: 14px;
  color: #ccc;
}

.footer-links, .footer-social {
  margin-top: 20px;
}

.footer-links h3, .footer-social h3 {
  margin-bottom: 10px;
  font-size: 16px;
}
.footer-links ul {
  list-style: none;
  padding: 0;
}

.footer-links li {
  margin-bottom: 8px;
}

.footer-links a {
  color: #ccc;
  text-decoration: none;
  font-size: 14px;
}
.footer-links a:hover {
  color: #00aced;
}

.social-icons {
  display: flex;
  gap: 15px;
  margin-top: 10px;
}
.social-icons a {
  color: #ccc;
  font-size: 18px;
  transition: color 0.3s;
}

.social-icons a:hover {
  color: #00aced;
}
.footer-bottom {
  text-align: center;
  padding-top: 20px;
  font-size: 14px;
  color: #aaa;
  border-top: 1px solid #333;
  margin-top: 30px;
}

/* Responsive dizayn */
@media (max-width: 768px) {
  .footer-container {
    flex-direction: column;
    text-align: center;
  }
  .footer-links, .footer-social {
    margin-top: 30px;
  }

  .social-icons {
    justify-content: center;
  }
}
    
  </style>
</head>

<body>

    </div>
  </header>
  
             <!-- footer -->

    <div class="footer-container">

        </a>
        <br>

        <br>
        <a href="#" style="text-decoration: none;">facebook</a>
      </h3>
        <div class="social-icons">
          <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
          <a href="https://t.me/hoziruz" target="_blank"><i class="fab fa-telegram"></i></a>
   </div>
</div>
</div>

<div class="footer-bottom">
<p> 2025 hozir.uz[ш|а]</p>

  </footer>
</body>
</html>
